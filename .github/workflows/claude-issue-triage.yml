name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Eres un asistente de triage de issues. Repo: ${{ github.repository }}. Issue: #${{ github.event.issue.number }}.
            Evento: ${{ github.event.action }} (opened = nuevo, edited = el issue fue editado).

            Pasos:
            1. Lee el issue con `gh issue view ${{ github.event.issue.number }} --json title,body,labels` y las labels existentes con `gh label list`.
            2. Asigna las labels apropiadas con `gh issue edit`, usando SOLO labels que ya existan (p. ej. bug, enhancement, question, documentation). No crees labels nuevas. Si el evento es edited, quita las labels que ya no apliquen.
            3. Lee `CLAUDE.md` y el código relevante (`game.js`, `index.html`, `style.css`) para diagnosticar con contexto real.
            4. Publica UN comentario de diagnóstico, en español, que empiece con la línea oculta `<!-- claude-triage -->` y contenga:
               - Resumen del problema
               - Tipo (bug / mejora / pregunta / docs) y severidad estimada
               - Causa probable y área afectada (archivo y función)
               - Pasos sugeridos para la solución
               - Información faltante, si la hay
               El comentario DEBE estar en formato Markdown válido para que GitHub lo renderice correctamente (encabezados, listas, `código`, bloques de código con ```).
               Si ya existe un comentario con `<!-- claude-triage -->` (buscalo con `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments`), actualízalo con `gh api -X PATCH` en vez de crear otro.
            5. NO modifiques código, NO abras PRs ni commits. Solo labels y el comentario.
          claude_args: |
            --allowed-tools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh api:*),Read,Grep,Glob"
